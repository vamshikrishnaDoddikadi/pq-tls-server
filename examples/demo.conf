# =========================================================================
# PQ-TLS Server — local demo configuration
#   ./build/bin/pq-tls-server --config examples/demo.conf
# (start the example backend first: python3 examples/backend/backend.py)
# =========================================================================

[listen]
address = 127.0.0.1
port = 8443

[tls]
cert = examples/certs/server-cert.pem
key  = examples/certs/server-key.pem
groups = X25519MLKEM768:SecP256r1MLKEM768:X25519:P-256
session_cache_size = 10000

[upstream]
backend = 127.0.0.1:8080

[server]
workers = 2
max_connections = 256

[health]
port = 9090

[rate_limit]
per_ip = 100

[logging]
level = debug
json = false

[mgmt]
localhost_only = true
