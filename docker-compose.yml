services:
  pq-tls-server:
    build: .
    ports:
      - "8443:8443"
      - "9090:9090"
    volumes:
      - ./certs:/etc/pq-tls-server/certs:ro
      - ./etc/pq-tls-server.conf:/etc/pq-tls-server/pq-tls-server.conf:ro
    restart: unless-stopped
    stop_grace_period: 15s   # > drain_timeout, lets in-flight requests finish
    depends_on:
      - backend

  # Example backend — replace with your actual application
  backend:
    image: nginx:alpine
    ports:
      - "8080:80"
