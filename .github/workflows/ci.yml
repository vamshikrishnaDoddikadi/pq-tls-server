name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenSSL 3.0 + oqs-provider · Debug (ASan/UBSan)
            build_type: Debug
            provider: true
            cflags: ""
          - name: OpenSSL 3.0 + oqs-provider · Release (-Werror)
            build_type: Release
            provider: true
            cflags: "-Werror"
            artifact: true
          - name: OpenSSL 3.5 native ML-KEM · Debian 13 (ASan/UBSan)
            build_type: Debug
            provider: false
            cflags: ""
            container: debian:trixie

    steps:
      - name: Install build dependencies (Debian container)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates curl xxd \
            libssl-dev pkg-config python3 openssl

      - uses: actions/checkout@v4

      - name: Install build dependencies (Ubuntu)
        if: ${{ !matrix.container }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev pkg-config xxd

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: deps-${{ matrix.container || 'ubuntu-24.04' }}-provider-${{ matrix.provider }}-${{ hashFiles('scripts/deps.env', 'scripts/build-deps.sh') }}

      - name: Build pinned dependencies (liboqs, oqs-provider, Chart.js)
        run: scripts/build-deps.sh ${{ !matrix.provider && '--no-provider' || '' }}

      - name: Embed dashboard assets
        run: bash tools/embed_assets.sh

      - name: Build
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_FLAGS="${{ matrix.cflags }}"
          ninja -C build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end tests (real PQ handshakes)
        run: |
          if [ "${{ matrix.provider }}" = "true" ]; then
            export OPENSSL_MODULES="$PWD/vendor/oqs-provider/build/lib"
          fi
          export LD_LIBRARY_PATH="$PWD/vendor/liboqs/lib"
          tests/e2e/e2e.sh build/bin/pq-tls-server

      - name: Benchmark smoke test
        run: ./build/bin/pq-tls-server benchmark --iterations 20

      - name: Upload binary
        if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: pq-tls-server-linux-amd64
          path: |
            build/bin/pq-tls-server
            vendor/liboqs/lib/liboqs.so*

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        run: |
          cppcheck --enable=warning,portability,performance --inline-suppr \
            --std=c11 -D_GNU_SOURCE --error-exitcode=1 -q \
            --suppress=missingIncludeSystem \
            -I src/common -I src/core -I src/http -I src/proxy \
            -I src/security -I src/mgmt -I src/benchmark \
            -i src/mgmt/static_assets.c \
            src tests

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: vamshikrishna/pq-tls-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=git-

      # The image build runs the unit and end-to-end suites against
      # OpenSSL 3.5's native ML-KEM before producing the runtime stage.
      - name: Build (and push on main / tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
