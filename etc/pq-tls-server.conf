# =========================================================================
# PQ-TLS Server Configuration
# =========================================================================
# Post-Quantum TLS Termination Reverse Proxy
# All values shown are defaults unless noted otherwise.

[listen]
# Network interface to bind to (0.0.0.0 = all interfaces)
address = 0.0.0.0
# TLS listen port
port = 8443

[tls]
# TLS certificate and private key (PEM format) — REQUIRED
cert = /etc/pq-tls-server/certs/server.crt
key  = /etc/pq-tls-server/certs/server.key

# CA certificate for client authentication (optional)
# ca = /etc/pq-tls-server/certs/ca.crt
# client_auth = false

# Key exchange groups, in preference order.
# X25519MLKEM768 / SecP256r1MLKEM768 are hybrid post-quantum + classical
# groups (ML-KEM, FIPS 203); X25519 / P-256 are classical fallbacks for
# clients without PQ support. Groups the loaded OpenSSL providers do not
# support are skipped at startup (OpenSSL >= 3.5 supports the hybrids
# natively, older versions need oqs-provider).
groups = X25519MLKEM768:SecP256r1MLKEM768:X25519:P-256

# Refuse clients that cannot negotiate post-quantum key exchange
# (implies TLS 1.3 only).
# require_pq = false

# Minimum TLS version (1.2 or 1.3)
min_version = 1.3

# TLS session cache size (0 = disabled)
# Enables TLS session resumption for faster reconnects. Resumed TLS 1.3
# sessions still perform a fresh (PQ) key exchange.
session_cache_size = 20000

# Deadline for the TLS handshake and for each HTTP request head (ms)
# handshake_timeout = 10000

[upstream]
# Backend servers to proxy traffic to.
# Format: host:port, [ipv6]:port, unix:/path/to/sock
# Weighted: host:port;weight=3 (1-100)
# (TLS to backends is not supported yet; keep backends on a trusted network)
# Multiple backends enable weighted round-robin load balancing.
backend = 127.0.0.1:8080

# Examples of multiple backends with weights:
# backend = 10.0.0.1:8080;weight=3
# backend = 10.0.0.2:8080;weight=1
# backend = unix:/var/run/app.sock

# Connection timeout to backend (milliseconds)
connect_timeout = 5000
# Idle timeout — close connection after this much inactivity (ms)
timeout = 30000

# http: rewrite every request's X-Forwarded-For / X-Forwarded-Proto /
#       X-Real-IP / X-PQ-* headers (client-supplied values are removed)
# tcp:  relay bytes untouched (for non-HTTP protocols)
# mode = http

[server]
# Acceptor threads (0 = auto). Each connection is served by its own thread.
workers = 0
# Maximum concurrent client connections
max_connections = 1024
# On SIGTERM, let in-flight connections finish for up to this long (ms)
# drain_timeout = 10000

# Run as a background daemon
# daemonize = false
# pid_file = /var/run/pq-tls-server.pid

[logging]
# Log file path (empty = stderr)
# file = /var/log/pq-tls-server.log

# Log level: debug, info, warn, error
level = info

# Log each proxied request
access_log = true

# Enable structured JSON log output
# json = false

[health]
# Management dashboard / metrics / health HTTP endpoint (0 = disabled)
# Serves: / (management UI), /metrics (Prometheus), /api/stats (JSON),
#         /api/stream (SSE), /health (status check), /api/* (REST API)
# port = 9090
# (set [mgmt] localhost_only = true to bind it to 127.0.0.1 only)

[rate_limit]
# Per-IP connection rate limit (0 = disabled)
# Maximum new connections per second per IP address
# per_ip = 50
# Token bucket burst capacity (default: 2x per_ip)
# burst = 100

[acl]
# Access control mode: disabled, allowlist, blocklist
# mode = disabled

# IP addresses or CIDR ranges
# When mode = allowlist: only these IPs can connect
# When mode = blocklist: these IPs are blocked
# entry = 10.0.0.0/8
# entry = 192.168.1.0/24
# entry = 172.16.0.0/12

[mgmt]
# Management UI settings
# enabled = true
#
# Admin credentials (set during first-run setup via the browser)
# admin_user = admin
# admin_pass_hash = (auto-generated PBKDF2-SHA256 hash)
#
# Certificate store directory for managing certs via the UI
# cert_store = certs
#
# Bind the dashboard/metrics port to 127.0.0.1 only
# localhost_only = false
